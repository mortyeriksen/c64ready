<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="t d">
<title id="t">Mending a damaged turbo block</title>
<desc id="d">Six readings of one damaged turbo block, each a bar with red marks where its pulses could not be read: as recorded, the other channel, and treble lifts of 1.5, 2.5, 3.5 and 5. The lifts of 2.5 and 3.5 read cleanly and agree, so the block is proved and written back clean. A note explains that one reading alone is marked unconfirmed, two that disagree leave the block alone, and that clean stretches of several readings can be spliced, always marked unconfirmed.</desc>
<rect width="960" height="548" rx="12" fill="#0b0e24"/>
<text x="480" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Mending a damaged turbo block</text><text x="480" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8a8aa8" text-anchor="middle">A turbo file is written once, so the only second chance is reading the same stretch of recording again, differently.</text><text x="30" y="121" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ccd0ec" text-anchor="start">as recorded</text><rect x="260" y="104" width="660" height="24" rx="4" fill="#16193a" stroke="#2c2f63" stroke-width="1"/><rect x="537.2" y="104" width="85.80000000000004" height="24" fill="#e8777c" opacity="0.85"/><text x="246" y="121" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e8777c" text-anchor="end">✗</text><text x="30" y="161" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ccd0ec" text-anchor="start">other channel</text><rect x="260" y="144" width="660" height="24" rx="4" fill="#16193a" stroke="#2c2f63" stroke-width="1"/><rect x="378.8" y="144" width="52.80000000000001" height="24" fill="#e8777c" opacity="0.85"/><rect x="722" y="144" width="26.400000000000023" height="24" fill="#e8777c" opacity="0.85"/><text x="246" y="161" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e8777c" text-anchor="end">✗</text><text x="30" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ccd0ec" text-anchor="start">treble lift 1.5</text><rect x="260" y="184" width="660" height="24" rx="4" fill="#16193a" stroke="#2c2f63" stroke-width="1"/><rect x="563.6" y="184" width="39.6" height="24" fill="#e8777c" opacity="0.85"/><text x="246" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e8777c" text-anchor="end">✗</text><text x="30" y="241" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ccd0ec" text-anchor="start">treble lift 2.5</text><rect x="260" y="224" width="660" height="24" rx="4" fill="#16193a" stroke="#2c2f63" stroke-width="1"/><text x="246" y="241" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#8fe985" text-anchor="end">✓</text><text x="912" y="241" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fe985" text-anchor="end">checksum passes</text><text x="30" y="281" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ccd0ec" text-anchor="start">treble lift 3.5</text><rect x="260" y="264" width="660" height="24" rx="4" fill="#16193a" stroke="#2c2f63" stroke-width="1"/><text x="246" y="281" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#8fe985" text-anchor="end">✓</text><text x="912" y="281" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fe985" text-anchor="end">checksum passes</text><text x="30" y="321" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ccd0ec" text-anchor="start">treble lift 5</text><rect x="260" y="304" width="660" height="24" rx="4" fill="#16193a" stroke="#2c2f63" stroke-width="1"/><rect x="840.8" y="304" width="33.00000000000003" height="24" fill="#e8777c" opacity="0.85"/><text x="246" y="321" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e8777c" text-anchor="end">✗</text><path d="M226,228 C208,248 208,268 226,284" fill="none" stroke="#8fe985" stroke-width="1.6"/><rect x="30" y="362" width="890" height="96" rx="8" fill="#11142e" stroke="#8fe985" stroke-width="1.4"/><text x="50" y="390" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Two readings agree byte for byte → the block is proved, and written back clean</text><text x="50" y="412" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ccd0ec" text-anchor="start">at the two pulse widths the tape uses elsewhere, so the original loader reads it as if new.</text><text x="50" y="434" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6dd6b" text-anchor="start">One reading alone: put back, but marked unconfirmed. Two that disagree: left as it was.</text><text x="30" y="480" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">No whole reading passes?</text><text x="30" y="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ccd0ec" text-anchor="start">Each reading is trusted except around its faults, and the clean stretches are spliced together,</text><text x="30" y="518" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8a8aa8" text-anchor="start">cut 30, 10, then 1.5 ms short of a fault. The checksum judges the result; a splice is always unconfirmed.</text>
</svg>
