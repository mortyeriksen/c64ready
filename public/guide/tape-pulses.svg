<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">What a pulse is</title>
<desc id="d">A noisy tape waveform swinging about a dashed centre line, with a shaded gate band at plus and minus a quarter of the level. Dots mark the centre crossings. Brackets under the wave measure each pulse, one full swing, and label it S 384, M 528 or L 688 cycles: the KERNAL tape format's short, medium and long pulses.</desc>
<rect width="960" height="420" rx="12" fill="#0b0e24"/>
<text x="480" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">What a pulse is</text><text x="480" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8a8aa8" text-anchor="middle">A C64 tape stores data as the time between edges. One full swing, up and back down, is one pulse.</text><rect x="70" y="180" width="723.5200000000002" height="40" fill="#9f9df2" opacity="0.10"/><line x1="70" y1="200" x2="793.5200000000002" y2="200" stroke="#9f9df2" stroke-width="1" stroke-dasharray="4 4"/><text x="801.5200000000002" y="204" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9f9df2" text-anchor="start">centre</text><text x="801.5200000000002" y="184" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9f9df2" text-anchor="start">gate ±0.25</text><path d="M70.0,202.4 L72.0,185.1 L74.1,174.2 L76.1,161.4 L78.1,148.5 L80.1,143.2 L82.2,141.9 L84.2,140.5 L86.2,142.0 L88.2,143.8 L90.3,142.4 L92.3,141.1 L94.3,139.6 L96.3,144.6 L98.4,150.2 L100.4,159.0 L102.4,172.2 L104.5,189.3 L106.5,199.1 L108.5,210.9 L110.5,217.7 L112.6,226.5 L114.6,238.8 L116.6,247.4 L118.6,256.9 L120.7,268.6 L122.7,276.5 L124.7,279.6 L126.7,275.2 L128.8,267.6 L130.8,259.5 L132.8,248.3 L134.9,235.4 L136.9,228.8 L138.9,221.4 L140.9,211.7 L143.0,200.3 L143.0,201.0 L145.0,185.1 L147.0,172.9 L149.0,158.9 L151.1,147.8 L153.1,145.4 L155.1,142.2 L157.1,141.4 L159.2,143.2 L161.2,144.4 L163.2,144.7 L165.3,139.8 L167.3,143.2 L169.3,144.0 L171.3,150.4 L173.4,159.2 L175.4,171.2 L177.4,187.1 L179.4,201.6 L181.5,211.2 L183.5,220.7 L185.5,228.7 L187.5,237.4 L189.6,248.3 L191.6,258.7 L193.6,269.0 L195.7,278.5 L197.7,278.0 L199.7,277.4 L201.7,267.8 L203.8,258.2 L205.8,246.8 L207.8,237.0 L209.8,228.0 L211.9,218.8 L213.9,208.7 L215.9,200.5 L215.9,199.0 L217.9,192.1 L219.9,