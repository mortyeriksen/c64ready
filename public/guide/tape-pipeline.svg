<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">From a worn cassette to a tape that loads</title>
<desc id="d">Seven stages in a row: read the recording, measure the signal, find the pulses, line up the channels, compare the readings, mend damaged files, read the directory. Below, a noisy recording with a dropout goes in on the left, and clean square pulses come out on the right as a .tap. Every file gets a verdict: readable, mended, unconfirmed or damaged.</desc>
<rect width="1200" height="675" rx="12" fill="#0b0e24"/>
