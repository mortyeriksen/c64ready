    Network-only analytics marker. The installed PWA fetches this on launch
    (the beacon in src/main.js, gated on _isInstalled()) so Netlify's
    server-side analytics logs installed-app launches under Top Pages as
    /pwa.html, distinct from browser visits to /. Deliberately kept OUT of the
    precache (vite.config.js globIgnores) and passed straight to the network by
    the service worker (src/sw.js), so the request reaches Netlify's edge
    instead of being served from the offline cache.
